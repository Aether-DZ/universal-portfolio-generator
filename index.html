<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Portfolio Generator</title>

  <!-- Google Fonts: Archivo + Space Grotesk -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Devicon (skill icons) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- AOS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Archivo', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            mono: {
              50: '#f8f9fa', 100: '#f1f3f5', 200: '#e9ecef',
              300: '#dee2e6', 400: '#ced4da', 500: '#adb5bd',
              600: '#868e96', 700: '#495057', 800: '#343a40',
              900: '#212529', 950: '#0d1117'
            }
          }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-mono-50 dark:bg-mono-950 text-mono-900 dark:text-mono-100 min-h-screen antialiased">
  <!-- Loading Overlay -->
  <div id="loading-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center">
    <div class="bg-white dark:bg-mono-800 rounded-2xl p-8 shadow-2xl flex flex-col items-center gap-4">
      <div class="w-10 h-10 border-[3px] border-blue-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-sm font-medium text-mono-600 dark:text-mono-300" id="loading-text">Loading...</p>
    </div>
  </div>

  <!-- Generate Confirmation Modal -->
  <div id="generate-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white dark:bg-mono-800 rounded-2xl shadow-2xl max-w-md w-full p-6 text-center animate-fadeIn">
      <div class="w-16 h-16 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center mx-auto mb-4 shadow-lg">
        <i class="fas fa-wand-magic-sparkles text-2xl text-white"></i>
      </div>
      <h3 class="text-lg font-bold mb-2" data-i18n="modal.generate.title">Generate Portfolio</h3>
      <p class="text-sm text-mono-500 dark:text-mono-400 mb-1" data-i18n="modal.generate.desc">Ready to create your portfolio website</p>
      <p class="text-xs text-mono-400 dark:text-mono-500 mb-5" id="modal-cooldown-msg"></p>
      <div class="flex gap-3 justify-center">
        <button id="modal-cancel" class="px-5 py-2.5 border border-mono-300 dark:border-mono-700 rounded-xl text-sm font-medium hover:bg-mono-100 dark:hover:bg-mono-800 transition" data-i18n="modal.cancel">Cancel</button>
        <button id="modal-confirm" class="px-6 py-2.5 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white rounded-xl text-sm font-medium transition shadow-lg flex items-center gap-2">
          <i class="fas fa-wand-magic-sparkles"></i>
          <span data-i18n="modal.generate.btn">Generate!</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Download Tip Modal -->
  <div id="tip-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white dark:bg-mono-800 rounded-2xl shadow-2xl max-w-md w-full p-6 text-center animate-fadeIn">
      <div class="w-16 h-16 rounded-full bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center mx-auto mb-4 shadow-lg">
        <i class="fas fa-lightbulb text-2xl text-white"></i>
      </div>
      <h3 class="text-lg font-bold mb-2" id="tip-modal-title" data-i18n="modal.tip.title">💡 Tip</h3>
      <p class="text-sm text-mono-600 dark:text-mono-300 mb-5" id="tip-modal-text"></p>
      <button id="tip-modal-ok" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-medium transition shadow-lg" data-i18n="modal.tip.ok">Got it!</button>
    </div>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white/80 dark:bg-mono-950/80 backdrop-blur-xl border-b border-mono-200 dark:border-mono-800">
    <div class="max-w-5xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-14">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white text-sm">
            <i class="fas fa-wand-magic-sparkles"></i>
          </div>
          <h1 class="text-base font-semibold font-display tracking-tight" data-i18n="app.title">Universal Portfolio Generator</h1>
        </div>
        <div class="flex items-center gap-2">
          <button id="preview-toggle" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium transition shadow-sm" title="Toggle Preview">
            <i class="fas fa-eye"></i>
            <span class="hidden sm:inline">Preview</span>
          </button>
          <button id="lang-toggle" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-mono-300 dark:border-mono-700 hover:bg-mono-100 dark:hover:bg-mono-800 transition text-xs font-medium">
            <i class="fas fa-globe text-blue-600 dark:text-blue-400"></i>
            <span id="lang-label">AR</span>
          </button>
          <button id="theme-toggle" class="p-1.5 rounded-lg hover:bg-mono-100 dark:hover:bg-mono-800 transition text-mono-500" title="Toggle dark mode">
            <i class="fas fa-moon dark:fa-sun text-sm"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Step Indicator -->
  <div id="step-indicator" class="max-w-5xl mx-auto px-4 sm:px-6 pt-5 pb-3">
    <div class="flex items-center justify-center gap-0">
      <div class="step-dot active" data-step="1">
        <i class="fas fa-user text-xs"></i>
        <span class="step-label" data-i18n="app.step1">Profile</span>
      </div>
      <div class="step-line"><div class="step-progress"></div></div>
      <div class="step-dot" data-step="2">
        <i class="fas fa-share-nodes text-xs"></i>
        <span class="step-label" data-i18n="app.step2">Social</span>
      </div>
      <div class="step-line"><div class="step-progress"></div></div>
      <div class="step-dot" data-step="3">
        <i class="fas fa-code text-xs"></i>
        <span class="step-label" data-i18n="app.step3">Skills</span>
      </div>
      <div class="step-line"><div class="step-progress"></div></div>
      <div class="step-dot" data-step="4">
        <i class="fas fa-folder-open text-xs"></i>
        <span class="step-label" data-i18n="app.step4">Projects</span>
      </div>
      <div class="step-line"><div class="step-progress"></div></div>
      <div class="step-dot" data-step="5">
        <i class="fas fa-palette text-xs"></i>
        <span class="step-label" data-i18n="app.step5">Theme</span>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 pb-8">
    <div class="flex gap-6">
      <!-- Form Panel (centered, takes primary space) -->
      <div id="form-panel" class="flex-1 min-w-0 transition-all duration-300">
        <div class="bg-white dark:bg-mono-900 rounded-2xl shadow-sm border border-mono-200 dark:border-mono-800 p-5 sm:p-6">
          <div id="form-container"></div>
        </div>
      </div>

      <!-- Preview Panel (hidden by default, slides in) -->
      <div id="preview-panel" class="hidden w-[420px] flex-shrink-0 transition-all duration-300">
        <div class="sticky top-20">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-medium text-mono-500 uppercase tracking-wider">Live Preview</span>
            <div class="flex items-center gap-1">
              <button class="viewport-btn active px-2 py-1 rounded text-xs border border-mono-300 dark:border-mono-700 hover:bg-mono-100 dark:hover:bg-mono-800 transition" data-viewport="desktop" title="Desktop">
                <i class="fas fa-desktop"></i>
              </button>
              <button class="viewport-btn px-2 py-1 rounded text-xs border border-mono-300 dark:border-mono-700 hover:bg-mono-100 dark:hover:bg-mono-800 transition" data-viewport="tablet" title="Tablet">
                <i class="fas fa-tablet-alt"></i>
              </button>
              <button class="viewport-btn px-2 py-1 rounded text-xs border border-mono-300 dark:border-mono-700 hover:bg-mono-100 dark:hover:bg-mono-800 transition" data-viewport="mobile" title="Mobile">
                <i class="fas fa-mobile-alt"></i>
              </button>
              <button id="preview-close" class="px-2 py-1 rounded text-xs border border-mono-300 dark:border-mono-700 hover:bg-mono-100 dark:hover:bg-mono-800 transition text-mono-500">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>
          <div id="preview-wrapper" class="rounded-xl overflow-hidden border border-mono-200 dark:border-mono-800 shadow-sm bg-white transition-all">
            <iframe id="preview-frame" class="w-full h-[500px] transition-all" sandbox="allow-scripts allow-same-origin" srcdoc=""></iframe>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer / Export Actions -->
  <footer class="border-t border-mono-200 dark:border-mono-800 bg-white dark:bg-mono-950">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4">
      <div class="flex flex-wrap items-center justify-center gap-3">
        <button id="btn-deploy" class="inline-flex items-center gap-1.5 px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-medium transition shadow-sm">
          <i class="fab fa-github text-xs"></i>
          <span data-i18n="export.deploy">Deploy to GitHub Pages</span>
        </button>
        <button id="btn-zip" class="inline-flex items-center gap-1.5 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-medium transition shadow-sm">
          <i class="fas fa-file-archive text-xs"></i>
          <span data-i18n="export.zip">Download ZIP</span>
        </button>
        <button id="btn-save-config" class="inline-flex items-center gap-1.5 px-3 py-2.5 border border-mono-300 dark:border-mono-700 rounded-xl text-sm font-medium hover:bg-mono-100 dark:hover:bg-mono-800 transition">
          <i class="fas fa-download text-xs text-mono-500"></i>
          <span data-i18n="export.saveConfig">Export Config</span>
        </button>
        <button id="btn-load-config" class="inline-flex items-center gap-1.5 px-3 py-2.5 border border-mono-300 dark:border-mono-700 rounded-xl text-sm font-medium hover:bg-mono-100 dark:hover:bg-mono-800 transition">
          <i class="fas fa-upload text-xs text-mono-500"></i>
          <span data-i18n="export.loadConfig">Import Config</span>
        </button>
      </div>
      <!-- Deploy Section -->
      <div id="deploy-section" class="hidden max-w-xl mx-auto mt-4 space-y-3">
        <div class="bg-blue-50 dark:bg-blue-950/30 border border-blue-200 dark:border-blue-800 rounded-xl p-4">
          <div class="flex items-start gap-3">
            <i class="fas fa-code-branch text-blue-600 mt-0.5"></i>
            <div class="flex-1">
              <label class="block text-xs font-medium mb-1 text-mono-700 dark:text-mono-300">Repository Name <span class="text-mono-400">(optional)</span></label>
              <input type="text" id="repo-name-input" class="w-full px-3 py-2 rounded-lg border border-mono-300 dark:border-mono-700 bg-white dark:bg-mono-900 text-sm" placeholder="Leave empty for {username}.github.io">
              <p class="text-xs text-blue-700 dark:text-blue-400 mt-1">Creates repo under your account. Default: username.github.io</p>
            </div>
          </div>
        </div>
        <div class="bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800 rounded-xl p-4">
          <div class="flex items-start gap-3">
            <i class="fas fa-shield-halved text-amber-600 mt-0.5"></i>
            <div class="flex-1">
              <label class="block text-xs font-medium mb-1 text-mono-700 dark:text-mono-300" data-i18n="export.patLabel">GitHub Personal Access Token</label>
              <input type="password" id="pat-input" class="w-full px-3 py-2 rounded-lg border border-mono-300 dark:border-mono-700 bg-white dark:bg-mono-900 text-sm mb-1.5" placeholder="ghp_...">
              <p class="text-xs text-amber-700 dark:text-amber-400" data-i18n="export.patNote">Requires repo scope. Never stored — stays in browser memory only.</p>
            </div>
          </div>
        </div>
        <div id="deploy-result"></div>
        <div class="flex flex-wrap gap-2">
          <button id="btn-sync-repos" class="flex-1 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-medium transition shadow-sm">
            <i class="fas fa-sync mr-1"></i> Sync GitHub Repos
          </button>
          <button id="btn-cname" class="flex-1 px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-xl text-xs font-medium transition shadow-sm">
            <i class="fas fa-globe mr-1"></i> Generate CNAME
          </button>
        </div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@octokit/rest"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <!-- App JS files -->
  <script src="js/i18n.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/design-tokens.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/form.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/github.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
